services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
    ports:
      - 5433:5432
    volumes:
      - deckforge_postgres:/var/lib/postgresql/data
    networks:
      - deckforge_net
  rabbitmq:
    image: rabbitmq:management
    hostname: rabbitmq
    restart: always
    env_file:
      - .env
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    ports:
      - 15672:15672
      - 5672:5672
    networks:
      - deckforge_net

volumes:
  deckforge_postgres:

networks:
  deckforge_net:
    driver: bridge
